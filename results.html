<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大会結果｜鳥取市テニス協会</title>
  <meta name="description" content="鳥取市テニス協会が主催した大会の結果を年度別に掲載しています。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/img/ball.svg" type="image/svg+xml">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main>
    <div class="page-hero">
      <div class="container">
        <p class="page-hero__en">Results</p>
        <h1 class="page-hero__title">大会結果</h1>
        <p class="page-hero__lead">協会主催大会の結果を年度別に掲載しています。</p>
      </div>
      <img class="page-hero__deco" src="assets/img/ball.svg" alt="" aria-hidden="true">
    </div>
    <nav class="breadcrumb container" aria-label="パンくずリスト">
      <a href="index.html">ホーム</a><span aria-hidden="true">/</span>大会結果
    </nav>

    <section class="section" style="padding-top:56px;">
      <div class="container container--narrow">
        <div class="year-tabs" id="year-tabs" role="group" aria-label="年度で絞り込み"></div>
        <div id="results-list">
          <p class="empty-note">読み込み中…</p>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/common.js"></script>
  <script>
    let resultYears = [];

    function renderYear(year) {
      const data = resultYears.find((y) => y.year === year);
      const listEl = document.getElementById("results-list");
      if (!data || data.items.length === 0) {
        listEl.innerHTML = '<p class="empty-note">この年度の結果はまだ掲載されていません。</p>';
        return;
      }
      listEl.innerHTML = data.items
        .map((item) => {
          const rows = (item.rows || [])
            .map(
              (r) => `<tr><th>${escapeHTML(r.label)}</th><td>${escapeHTML(r.value)}</td></tr>`
            )
            .join("");
          const comment = item.comment
            ? `<p style="margin-top:12px;font-size:14px;color:var(--c-text-sub);">${escapeHTML(item.comment)}</p>`
            : "";
          const doc = item.docUrl
            ? `<p class="result-item__links"><a class="btn btn--outline" style="padding:10px 22px;font-size:13px;" href="${escapeHTML(item.docUrl)}" target="_blank" rel="noopener">詳細結果（PDF）</a></p>`
            : "";
          return `
            <article class="result-item">
              <div class="result-item__head">
                <h2 class="result-item__name">${escapeHTML(item.name)}</h2>
                <span class="result-item__date">${escapeHTML(item.dateText)}</span>
              </div>
              <table>${rows}</table>
              ${comment}
              ${doc}
            </article>`;
        })
        .join("");
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const results = await loadJSON("data/results.json");
        resultYears = results.years;
        const tabs = document.getElementById("year-tabs");
        tabs.innerHTML = resultYears
          .map(
            (y, i) =>
              `<button type="button" data-year="${escapeHTML(y.year)}" aria-pressed="${i === 0}">${escapeHTML(y.year)}</button>`
          )
          .join("");
        tabs.addEventListener("click", (e) => {
          const btn = e.target.closest("button");
          if (!btn) return;
          tabs.querySelectorAll("button").forEach((b) =>
            b.setAttribute("aria-pressed", String(b === btn))
          );
          renderYear(btn.dataset.year);
        });
        if (resultYears.length) renderYear(resultYears[0].year);
      } catch (e) {
        document.getElementById("results-list").innerHTML =
          '<p class="empty-note">大会結果を読み込めませんでした。</p>';
      }
    });
  </script>
</body>
</html>
